name: P0 Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Upgrade npm for deterministic dependency resolution
        run: npm install --global npm@11.19.1

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: P0 freeze verification
        run: npm run verify:p0
